name: CI

on:
  push:
    branches: ["main", "kevin_hin_unittest"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
        

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run unit tests
        run: pnpm test
